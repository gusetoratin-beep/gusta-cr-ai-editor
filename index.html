<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GUSTA CR AI EDITOR</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      padding: 30px 20px;

      background: #080f20;

      color: white;

      font-family: Arial, sans-serif;

      text-align: center;

    }

    .container {

      max-width: 600px;

      margin: 50px auto;

      padding: 30px 20px;

      background: #111d33;

      border: 1px solid #28649a;

      border-radius: 18px;

    }

    h1 {

      font-size: 27px;

    }

    h1 span {

      color: #36a8ff;

    }

    p {

      color: #b7c7df;

      line-height: 1.6;

    }

    label {

      display: block;

      margin-top: 25px;

      padding: 25px 10px;

      border: 2px dashed #36a8ff;

      border-radius: 12px;

      color: #36a8ff;

      cursor: pointer;

    }

    input {

      display: none;

    }

    video {

      display: none;

      width: 100%;

      margin-top: 20px;

      border-radius: 10px;

    }

    button {

      width: 100%;

      margin-top: 20px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #1689e8;

      color: white;

      font-size: 16px;

      font-weight: bold;

    }

    #status {

      margin-top: 18px;

      color: #ffd36a;

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>GUSTA CR <span>AI EDITOR</span></h1>

    <p>Seu gameplay. Nossa inteligência.</p>

    <p>Seu espaço para analisar partidas e criar vídeos de Clash Royale.</p>

    <label for="video">

      🎮 TOQUE AQUI PARA IMPORTAR SUA PARTIDA

    </label>

    <input type="file" id="video" accept="video/*">

    <video id="preview" controls playsinline></video>

    <button onclick="analisar()">ANALISAR PARTIDA</button>

    <p id="status">Aguardando seu vídeo...</p>

  </div>

  <script>

    const video = document.getElementById("video");

    const preview = document.getElementById("preview");

    const status = document.getElementById("status");

    video.addEventListener("change", function() {

      const arquivo = this.files[0];

      if (!arquivo) return;

      preview.src = URL.createObjectURL(arquivo);

      preview.style.display = "block";

      status.textContent = "Vídeo carregado com sucesso!";

    });

    function analisar() {

      if (!video.files.length) {

        status.textContent = "Primeiro importe uma partida.";

        return;

      }

      status.textContent =

        "Vídeo recebido! A análise inteligente ainda está em desenvolvimento.";

    }

  </script>

</body>

</html>
